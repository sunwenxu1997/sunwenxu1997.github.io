    <meta charset="UTF-8" />

      rel="stylesheet"

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <meta property="og:title" content="誰在花里胡哨的主页" />
    <meta property="og:description" content="一个喜欢花里胡哨的，前端彩鸡🐔" />
    <meta property="og:image" content="https://sunwenxu1997.github.io/images/favicon.jpg" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Rajdhani:300&display=swap">
    <title>誰在花里胡哨</title>
    <style>
      #loading-progress {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #f8f8f8;
        z-index: 9999;
        display: grid;
        place-content: center;
        color: #333333;
      }

      #loading-progress .loading {
        width: 5rem;
        text-align: center;
        font-size: 0.88rem;
        font-weight: 400;
        position: relative;
        z-index: 2;
        font-family: 'Rajdhani', sans-serif;
      }

      #loading-progress .value {
        margin-right: 0.2rem;
        font-size: 1.3rem;
        font-weight: bold;
      }

      #loading-progress .progress {
        width: 0%;
        height: 2px;
        background-color: #333333;
        margin-top: 0.33rem;
        /* 不要写在 CSS 里：进度由 rAF 逐帧驱动，transition 会让数字追上目标的动画互相干扰 */
      }

      #loading-progress .progress::after {
        content: '';
        width: 100%;
        height: 2px;
        position: absolute;
        left: 0;
        z-index: -1;
        background-color: #dfdfdf;
      }
    </style>
  </head>

  <body>
    <!-- 加载遮罩放在 #app 外面，避免 Vue 挂载时被一起替换掉 -->
    <div id="loading-progress">
      <div class="loading">
        <div><span class="value">0</span>%</div>
        <div class="progress"></div>
      </div>
    </div>
    <div id="app"></div>
    <!-- 首屏进度工具：以 module 引入，模块执行即开始统计真实加载事件 -->
    <script type="module" src="/src/utils/loading.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
  <script defer src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.1.0-beta.3/libs/cn/index.js"></script>
  <script>
    // 等 SDK（defer）执行完再初始化，避免阻塞首屏加载进度起步
    window.addEventListener('DOMContentLoaded', function () {
      if (!window.CozeWebSDK) return
      const token = 'pat_jdhg7lITLl35eC8kdmlBsrohuTuwj0VRc17Dxe4NykmK8LYaRLq6ZuGliQDTQPQ0'
      window.cozeWebSDK = new CozeWebSDK.WebChatClient({
        auth: {
          // 身份验证方法，默认类型为‘unauth’，这意味着不需要身份验证；建议设置为“token”，表示通过PAT （Personal Access token）或OAuth进行身份验证
          type: 'token',
          // 当类型设置为“令牌”时，需要配置PAT（个人访问令牌）或OAuth访问令牌进行身份验证。
          token: token,
          // 当访问令牌过期时，请使用新的令牌并根据需要进行设置。
          onRefreshToken: () => token
        },
        config: {
          bot_id: '7472275735093395482'
        },
        componentProps: {
          title: '誰在花里胡哨'
        },
        ui: {
          base: {
            zIndex: 99
          },
          asstBtn: {
            isNeed: false
          },
          footer: {
            isShow: false
          }
        }
      })
    })
  </script>
</html>
