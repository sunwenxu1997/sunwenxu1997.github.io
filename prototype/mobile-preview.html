<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Mobile Preview</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #292524;
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
    font-family: -apple-system, sans-serif;
  }
  .device {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .device-label {
    color: #a8a29e;
    font-size: 12px;
    font-weight: 500;
  }
  .phone {
    width: 390px;
    height: 780px;
    border: 8px solid #1c1917;
    border-radius: 40px;
    background: #f5f5f4;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .phone iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .tablet {
    width: 820px;
    height: 780px;
    border: 8px solid #1c1917;
    border-radius: 24px;
    background: #f5f5f4;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .tablet iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>
  <div class="device">
    <div class="device-label">iPhone 14 Pro (390px)</div>
    <div class="phone">
      <iframe src="works.html"></iframe>
    </div>
  </div>
  <div class="device">
    <div class="device-label">iPad (820px)</div>
    <div class="tablet">
      <iframe src="works.html"></iframe>
    </div>
  </div>
</body>
</html>
