name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 关键：用 v3（内部是 upload-artifact@v4）+ 超时
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
        env:
          UPLOAD_PAGES_ARTIFACT_UPLOAD_TIMEOUT: 300

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4